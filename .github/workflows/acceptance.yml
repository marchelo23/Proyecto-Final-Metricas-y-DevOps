name: COM-01 acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acceptance
          POSTGRES_PASSWORD: acceptance_ci_only
          POSTGRES_DB: events_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acceptance -d events_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://acceptance:acceptance_ci_only@localhost:5432/events_test
      TEST_DATABASE_URL: postgresql+psycopg://acceptance:acceptance_ci_only@localhost:5432/events_test
      EVENT_PRODUCER_KEY: acceptance-producer-only
      EVENT_ANALYST_KEY: acceptance-analyst-only
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Preparar directorio de reportes
        run: mkdir -p artifacts
      - name: Aplicar migraciones
        run: uv run alembic upgrade head
      - name: Ejecutar pruebas de aceptación e integración
        run: >-
          uv run pytest
          --junitxml=artifacts/junit.xml
          --html=artifacts/acceptance.html --self-contained-html
      - name: Publicar JUnit y HTML incluso si falla la suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-reports
          path: artifacts/
          if-no-files-found: warn
