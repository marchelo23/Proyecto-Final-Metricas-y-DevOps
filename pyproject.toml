[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "event-service"
version = "0.1.0"
description = "Base del prototipo de ingesta y análisis de eventos"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.28,<1",
    "pytest-html>=4.1,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/event_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
